# Development self-test set for M3.1 risk-signal logic.
# Synthetic and reduced-real cases are allowed here. This file is not used for
# product-value claims.

version = "risk-signal-dev-cases.v1"

[[cases]]
id = "dev-assumption-boundary-positive-zero-timeout"
kind = "positive"
signal_ids = ["assumption_boundary"]
title = "pool timeout zero now reaches an unchecked expect"
diff_summary = "A timeout branch treats zero as an ordinary duration and calls expect on a missing timer."
expected_behavior = "detect"
ground_truth = "Boundary value zero strengthens a previous non-zero assumption and can panic."
source_refs = ["synthetic:m3.1"]
production_files = ["src/client/pool.rs"]
test_files = ["tests/pool_timeout.rs"]
limitations = "Synthetic case for local regression only."

[[cases]]
id = "dev-assumption-boundary-positive-closed-buffer"
kind = "positive"
signal_ids = ["assumption_boundary", "non_happy_path"]
title = "closed channel path assumes caller buffer is empty"
diff_summary = "Closed-channel branch asserts buffer.is_empty even though callers may pass a reused buffer."
expected_behavior = "detect"
ground_truth = "The diff depends on a hidden caller precondition on a closed-state path."
source_refs = ["reduced-real:tokio-rs-tokio-7991"]
production_files = ["tokio/src/sync/mpsc/chan.rs"]
test_files = ["tokio/tests/sync_mpsc.rs"]
limitations = "Reduced from real PR; exact code context is not embedded."

[[cases]]
id = "dev-assumption-boundary-negative-weaken-assert"
kind = "negative"
near_miss_signals = ["assumption_boundary"]
title = "replace assert with checked error return"
diff_summary = "A public parser changes assert(valid) into if !valid { return Err(...) }."
expected_behavior = "suppress"
ground_truth = "The assumption is weakened, not strengthened."
source_refs = ["synthetic:m3.1"]
production_files = ["src/parser.rs"]
test_files = ["tests/parser_invalid.rs"]
limitations = "Negative synthetic case."

