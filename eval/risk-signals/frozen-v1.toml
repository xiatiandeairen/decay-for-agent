# M3 40-case frozen eval v1 product-effect validation set.
#
# This file defines the product validation target. It is intentionally stricter
# than frozen-pilot-v1.toml. The set is not complete until it has 40 frozen
# cases and status = "complete".

version = "risk-signal-frozen-eval-v1"
status = "complete"
target_cases = 40
actual_cases = 40
source = "eval/risk-signals/eval-candidates.toml"
runner_corpus = "eval/corpus/risk-signal-frozen-v1.toml"
purpose = "Product-effect validation: compare fact-only vs semantic-filtered output without replacing cases to improve scores."
limitations = "Frozen v1 is complete as a 40-case product-effect validation set, but product value still depends on running the comparison and reporting misses/noise honestly."

