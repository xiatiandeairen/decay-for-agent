[metrics]
precision_at_top3_target = 0.75
actionable_pr_rate_target = 0.70
negative_control_silence_rate_target = 0.90
missed_high_risk_count_max = 1
weak_only_top_risk_max = 2

[gap]
missing_cases = 0
reason = "Initial 40 real PR seed review produced 26 freeze_ready cases. Frozen fill A added 9 cases and frozen fill B added 5 cases after strict review. The 40-case frozen eval v1 target is complete."
next_sources = [
  "new high-confidence runtime/protocol/concurrency correctness PRs",
  "split child cases for rollup PRs only when each child has clean ground truth",
  "blocked candidates with newly collected independent repro or test evidence",
]
excluded_tracks_for_v1 = [
  "platform performance without a dedicated performance signal",
  "macro compile-time hygiene until macro evidence is in scope",
  "build-only compatibility without executable build matrix evidence",
  "revert-only cases where the original risky diff is not represented",
  "duplicate aliases of already frozen PRs",
  "rollup PRs that mix unrelated risk sources into one judgement",
]
