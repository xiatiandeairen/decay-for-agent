# Phase-gate holdout set.
#
# This set is reserved for end-of-sprint validation of risk-item quality.
# Do not tune detectors, wrappers, or prompts against these cases inside the
# same sprint. Use dev-cases.toml for day-to-day iteration and frozen-v1.toml
# for version-level product-effect claims.

version = "risk-signal-holdout.v1"
status = "active"
source = "eval/risk-signals/eval-candidates.toml"
purpose = "Phase-gate validation for single-risk-item and wrapper changes without reusing the full frozen benchmark."
target_cases = 12
actual_cases = 12
use_rules = [
  "Use this set only for end-of-sprint gate judgement, not for in-sprint tuning.",
  "Do not replace cases to improve scores; if a case becomes invalid, mark the holdout gate blocked and collect a replacement separately.",
  "Any failed forbidden-claim check or evidence drift is a gate failure even if ranking metrics look better.",
]

[gate]
min_detection_precision = 0.85
min_value_precision = 0.70
min_evidence_valid_rate = 1.0
max_overclaim_rate = 0.0
min_unsupported_scope_silence_rate = 0.90

[[cases]]
id = "tokio-rs-tokio-7991"
candidate_status = "freeze_ready"
gate_role = "high_value_positive"
high_value = true
primary_signal_ids = ["assumption_boundary", "risk_path_test_gap"]
expected_behavior = "detect"
why_in_holdout = "Issue-backed closed-channel panic boundary with regression tests exercises assumption-strengthening and test-gap evidence."
forbidden_claims = [
  "do not generalize to all recv_many buffering paths",
  "do not claim loom or cross-platform coverage from this case alone",
]
required_context = ["issue_link_or_repro", "production_diff", "regression_test"]

[[cases]]
id = "tokio-rs-tokio-8001"
candidate_status = "freeze_ready"
gate_role = "high_value_positive"
high_value = true
primary_signal_ids = ["error_propagation", "state_transition"]
expected_behavior = "detect"
why_in_holdout = "Caller-visible UDP error propagation and readiness transition make this a strong non-happy-path semantic case."
forbidden_claims = [
  "do not claim behavior on all operating systems from one Linux-shaped path",
  "do not claim complete socket contract coverage without caller-path evidence",
]
required_context = ["issue_link_or_repro", "production_diff", "regression_test"]

