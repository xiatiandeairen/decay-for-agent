expected_judgement = "none"
max_wrapper_count = 0
ground_truth_summary = "This is a drop-path error propagation case and should stay under error_propagation, not lifecycle_ordering."
why_high_value = "Lifecycle wrapper must not absorb incomplete-body error surfacing cases."

